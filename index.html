<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月の満ち欠けシミュレーター</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --sun-color: #fcd34d;
            --moon-light: #f1f5f9;
            --moon-shadow: #334155;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0; 
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 10px 0;
            background-color: var(--bg-color);
            flex-shrink: 0;
            border-bottom: 1px solid #334155;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        /* --- レイアウト構成 --- */
        .app-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 15px;
            gap: 15px;
            min-height: 0; 
        }

        /* 上段エリア: 3カラム構成 (左:宇宙 / 中:操作 / 右:月の形) */
        .top-section {
            display: flex;
            flex: 1.2; /* 高さを確保 */
            gap: 15px;
            min-height: 0;
        }

        /* 中段エリア: スライダー */
        .slider-section {
            flex: 0 0 auto; 
        }

        /* 下段エリア: 地球視点 (ワイド) */
        .bottom-section {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* 共通パネルスタイル */
        .view-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 0; 
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            overflow: hidden;
        }

        /* 上段左右の正方形パネル */
        .square-panel {
            flex: 1; 
            aspect-ratio: 1 / 1; 
            max-width: 50vh; /* 大きくなりすぎないように */
        }

        .sky-panel {
            flex: 1;
            width: 100%;
        }

        .view-label {
            position: absolute;
            top: 10px;
            left: 10px; 
            background-color: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 10;
            border-left: 3px solid var(--accent-color);
            color: #fff;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- 中央コントロールパネル --- */
        .controls-panel {
            flex: 1; /* 中央で伸縮 */
            min-width: 200px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 上下中央寄せ */
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            overflow-y: auto; 
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        .control-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .control-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: bold;
        }

        .btn {
            background-color: var(--accent-color);
            border: none;
            color: #0f172a;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn:hover {
            background-color: #7dd3fc;
        }

        .speed-options {
            display: flex;
            justify-content: space-around;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }
        .radio-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .radio-label:hover {
            color: var(--accent-color);
        }
        .radio-label input {
            accent-color: var(--accent-color);
            transform: scale(1.1);
        }

        /* --- 情報ボックス (修正箇所) --- */
        .info-box {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: row; /* 横並びに変更 */
            justify-content: space-around; /* 均等配置 */
            align-items: center; /* 上下中央 */
            gap: 10px;
            text-align: center;
            flex-wrap: wrap; /* 画面が狭い場合に折り返す */
        }
        .info-item {
            font-family: monospace;
            font-size: 1rem;
            color: #e2e8f0;
        }
        .phase-name {
            font-weight: bold;
            color: #fbbf24;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
            margin-top: 0; /* マージンリセット */
        }

        /* --- スライダーパネル --- */
        .slider-panel {
            padding: 10px 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            height: 10px;
            background: #475569;
            border-radius: 5px;
            appearance: none;
            margin-top: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: 2px solid var(--panel-bg);
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        /* --- モバイル対応（縦画面対応） --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow-y: auto;
            }

            .app-container {
                display: flex;
                flex-direction: column;
                height: auto;
                gap: 15px;
                padding: 10px;
            }

            .top-section {
                flex-direction: column; /* スマホでは縦積み */
                flex: none;
                gap: 15px;
            }

            .square-panel {
                width: 100%;
                aspect-ratio: 1/1;
                max-width: none;
            }

            .controls-panel {
                width: 100%; 
                min-width: 0;
            }

            .bottom-section {
                flex: none;
                height: 250px; /* スマホでの固定高さ */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>月の満ち欠けシミュレーター</h1>
    </header>

    <div class="app-container">
        <!-- 上段エリア (3カラム) -->
        <div class="top-section">
            <!-- 左：宇宙からの視点 -->
            <div class="view-panel square-panel">
                <div class="view-label">宇宙からの視点 (北極上空)</div>
                <canvas id="orbitCanvas"></canvas>
            </div>

            <!-- 中：コントロールパネル (レイアウト修正: 状態 -> スピード -> 再生) -->
            <div class="controls-panel">
                
                <!-- 1. 情報表示 (一番上に配置) -->
                <div class="control-group">
                    <span class="control-label">現在の状態</span>
                    <div class="info-box">
                        <span id="dayDisplay" class="info-item">0日目</span>
                        <span id="timeDisplay" class="info-item">12:00</span>
                        <span id="phaseName" class="phase-name">新月</span>
                    </div>
                </div>

                <!-- 2. 再生スピード (真ん中に配置) -->
                <div class="control-group">
                    <span class="control-label">再生スピード</span>
                    <div class="speed-options">
                        <label class="radio-label"><input type="radio" name="speed" value="0.1"> 速め</label>
                        <label class="radio-label"><input type="radio" name="speed" value="0.05" checked> 普通</label>
                        <label class="radio-label"><input type="radio" name="speed" value="0.015"> 遅め</label>
                    </div>
                </div>

                <!-- 3. 再生ボタン (一番下に配置) -->
                <div class="control-group">
                    <button id="playBtn" class="btn">再生</button>
                </div>
            </div>

            <!-- 右：現在の月の形 -->
            <div class="view-panel square-panel">
                <div class="view-label">地球から見た月の形</div>
                <canvas id="currentMoonCanvas"></canvas>
            </div>
        </div>

        <!-- 中段エリア：時間スライダー -->
        <div class="slider-section">
            <div class="view-panel slider-panel">
                <span class="control-label" style="margin-bottom: 5px; color: #94a3b8; font-weight: bold; font-size: 0.9rem;">時間を動かす (60日分)</span>
                <input type="range" id="timeSlider" min="0" max="1440" value="12" step="0.1">
            </div>
        </div>

        <!-- 下段エリア：地球からの視点 (ワイド) -->
        <div class="bottom-section">
            <div class="view-panel sky-panel">
                <div class="view-label">地球からの視点 (南の空)</div>
                <canvas id="skyCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ORBIT_CANVAS = document.getElementById('orbitCanvas');
        const SKY_CANVAS = document.getElementById('skyCanvas');
        const CURRENT_MOON_CANVAS = document.getElementById('currentMoonCanvas');
        
        const ORBIT_CTX = ORBIT_CANVAS.getContext('2d');
        const SKY_CTX = SKY_CANVAS.getContext('2d');
        const CURRENT_MOON_CTX = CURRENT_MOON_CANVAS.getContext('2d');
        
        const PLAY_BTN = document.getElementById('playBtn');
        const TIME_SLIDER = document.getElementById('timeSlider');
        const DAY_DISPLAY = document.getElementById('dayDisplay');
        const TIME_DISPLAY = document.getElementById('timeDisplay');
        const PHASE_NAME_DISPLAY = document.getElementById('phaseName');
        const SPEED_RADIOS = document.querySelectorAll('input[name="speed"]');

        // Stars Data
        const STARS = [];
        for(let i=0; i<250; i++) {
            STARS.push({
                angle: Math.random() * Math.PI * 2, 
                radiusOffset: Math.random() * 0.4 + 0.8, 
                size: Math.random() * 1.5 + 0.5,
                brightness: Math.random()
            });
        }

        let state = {
            time: 12, // Start at Noon (12:00)
            isPlaying: false,
            animationId: null,
            moonPeriodHours: 29.53 * 24,
            speed: 0.05,
            maxTime: 1440 // 60 days
        };

        function resizeCanvas() {
            // 親要素のサイズに合わせてCanvas解像度を変更
            [ORBIT_CANVAS, SKY_CANVAS, CURRENT_MOON_CANVAS].forEach((canvas) => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            });
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // --- Core Logic ---

        const SUN_ANGLE = Math.PI; 

        function getMoonOrbitAngle(time) {
            const cycleProgress = (time % state.moonPeriodHours) / state.moonPeriodHours;
            return (SUN_ANGLE - cycleProgress * 2 * Math.PI + 2 * Math.PI) % (2 * Math.PI);
        }

        function getEarthRotationAngle(time) {
            const dayProgress = (time - 12) / 24;
            return (SUN_ANGLE - dayProgress * 2 * Math.PI + 2 * Math.PI) % (2 * Math.PI);
        }

        function getPhaseInfo(moonAngle) {
            let diff = SUN_ANGLE - moonAngle;
            diff = (diff % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
            const deg = (diff * 180 / Math.PI);
            
            let name = "";
            if (deg > 350 || deg <= 10) name = "新月";
            else if (deg > 10 && deg < 80) name = "三日月";
            else if (deg >= 80 && deg <= 100) name = "上弦の月";
            else if (deg > 100 && deg < 170) name = "十三夜";
            else if (deg >= 170 && deg <= 190) name = "満月";
            else if (deg > 190 && deg < 260) name = "十八夜";
            else if (deg >= 260 && deg <= 280) name = "下弦の月";
            else name = "二十六夜";

            return { degree: deg, name: name, radians: diff };
        }

        function formatTime(totalHours) {
            const days = Math.floor(totalHours / 24);
            const hours = Math.floor(totalHours % 24);
            const mins = Math.floor((totalHours % 1) * 60);
            return {
                dayStr: `${days}日目`,
                timeStr: `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`,
                drawStr: `${days}日目 ${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`
            };
        }

        // --- Orbit View (Square) ---
        function drawOrbitView() {
            const w = ORBIT_CANVAS.width;
            const h = ORBIT_CANVAS.height;
            const size = Math.min(w, h);
            const cx = w / 2;
            const cy = h / 2;
            
            const earthRadius = size * 0.12; 
            const orbitRadius = size * 0.38;
            const moonRadius = earthRadius * 0.35;

            ORBIT_CTX.clearRect(0, 0, w, h);

            // Sun Rays
            const gradient = ORBIT_CTX.createLinearGradient(0, 0, w * 0.4, 0);
            gradient.addColorStop(0, "rgba(253, 224, 71, 0.5)");
            gradient.addColorStop(1, "rgba(253, 224, 71, 0)");
            ORBIT_CTX.fillStyle = gradient;
            ORBIT_CTX.fillRect(0, 0, w * 0.4, h);

            ORBIT_CTX.beginPath();
            ORBIT_CTX.strokeStyle = "rgba(252, 211, 77, 0.4)";
            ORBIT_CTX.lineWidth = 2;
            for(let y = 0; y < h; y += 30) {
                ORBIT_CTX.moveTo(0, y); 
                ORBIT_CTX.lineTo(w * 0.3, y);
            }
            ORBIT_CTX.stroke();

            ORBIT_CTX.fillStyle = "#fff";
            ORBIT_CTX.font = "14px sans-serif";
            ORBIT_CTX.textAlign = "left";
            ORBIT_CTX.fillText("太陽の光", 10, cy - 20);
            ORBIT_CTX.textAlign = "center";

            // Earth
            ORBIT_CTX.save();
            ORBIT_CTX.translate(cx, cy);

            ORBIT_CTX.beginPath();
            ORBIT_CTX.arc(0, 0, earthRadius, 0, Math.PI * 2);
            ORBIT_CTX.fillStyle = "#3b82f6";
            ORBIT_CTX.fill();

            // Map
            const obsAngle = getEarthRotationAngle(state.time);
            ORBIT_CTX.save();
            ORBIT_CTX.rotate(obsAngle); 

            ORBIT_CTX.fillStyle = "#10b981"; 
            
            ORBIT_CTX.beginPath();
            ORBIT_CTX.moveTo(earthRadius * 0.4, -earthRadius * 0.1); 
            ORBIT_CTX.lineTo(earthRadius * 0.55, 0.1 * earthRadius);
            ORBIT_CTX.lineTo(earthRadius * 0.35, 0.5 * earthRadius);
            ORBIT_CTX.lineTo(0.05 * earthRadius, 0.6 * earthRadius);
            ORBIT_CTX.lineTo(-earthRadius * 0.2, 0.5 * earthRadius);
            ORBIT_CTX.lineTo(-earthRadius * 0.4, 0.7 * earthRadius); 
            ORBIT_CTX.lineTo(-earthRadius * 0.4, 0.1 * earthRadius);
            ORBIT_CTX.lineTo(-earthRadius * 0.1, 0.15 * earthRadius); 
            ORBIT_CTX.lineTo(earthRadius * 0.2, 0.15 * earthRadius);
            ORBIT_CTX.closePath();
            ORBIT_CTX.fill();

            ORBIT_CTX.beginPath();
            ORBIT_CTX.moveTo(earthRadius * 0.35, -earthRadius * 0.25);
            ORBIT_CTX.lineTo(earthRadius * 0.25, -earthRadius * 0.45);
            ORBIT_CTX.lineTo(0, -earthRadius * 0.55);
            ORBIT_CTX.lineTo(-earthRadius * 0.2, -earthRadius * 0.45);
            ORBIT_CTX.lineTo(-earthRadius * 0.1, -earthRadius * 0.25);
            ORBIT_CTX.lineTo(earthRadius * 0.1, -earthRadius * 0.2);
            ORBIT_CTX.closePath();
            ORBIT_CTX.fill();

            ORBIT_CTX.beginPath();
            ORBIT_CTX.moveTo(-earthRadius * 0.15, -earthRadius * 0.25);
            ORBIT_CTX.lineTo(-earthRadius * 0.15, -earthRadius * 0.4);
            ORBIT_CTX.lineTo(-earthRadius * 0.3, -earthRadius * 0.3);
            ORBIT_CTX.lineTo(-earthRadius * 0.25, -earthRadius * 0.15);
            ORBIT_CTX.closePath();
            ORBIT_CTX.fill();

            ORBIT_CTX.beginPath();
            ORBIT_CTX.ellipse(earthRadius * 0.2, 0.7 * earthRadius, earthRadius * 0.08, earthRadius * 0.06, 0.8, 0, Math.PI*2);
            ORBIT_CTX.fill();

            // Japan
            ORBIT_CTX.fillStyle = "#ef4444";
            ORBIT_CTX.beginPath();
            ORBIT_CTX.ellipse(earthRadius * 0.75, 0, earthRadius * 0.15, earthRadius * 0.05, 0.3, 0, Math.PI*2);
            ORBIT_CTX.ellipse(earthRadius * 0.82, -earthRadius * 0.12, earthRadius * 0.05, earthRadius * 0.04, 0.5, 0, Math.PI*2);
            ORBIT_CTX.fill();

            ORBIT_CTX.restore(); // End Map

            // Night
            ORBIT_CTX.beginPath();
            ORBIT_CTX.arc(0, 0, earthRadius, -Math.PI/2, Math.PI/2);
            ORBIT_CTX.fillStyle = "rgba(15, 23, 42, 0.8)";
            ORBIT_CTX.fill();

            // Observer
            const obsX = Math.cos(obsAngle) * (earthRadius * 0.75);
            const obsY = Math.sin(obsAngle) * (earthRadius * 0.75);

            ORBIT_CTX.beginPath();
            ORBIT_CTX.arc(obsX, obsY, 3, 0, Math.PI * 2);
            ORBIT_CTX.fillStyle = "#ffffff";
            ORBIT_CTX.fill();
            ORBIT_CTX.strokeStyle = "#ef4444";
            ORBIT_CTX.lineWidth = 1;
            ORBIT_CTX.stroke();

            // Cone
            const cornStartR = earthRadius * 0.75;
            const cornX = Math.cos(obsAngle) * cornStartR;
            const cornY = Math.sin(obsAngle) * cornStartR;
            ORBIT_CTX.beginPath();
            ORBIT_CTX.moveTo(cornX, cornY);
            ORBIT_CTX.arc(0, 0, earthRadius + 60, obsAngle - 0.6, obsAngle + 0.6);
            ORBIT_CTX.lineTo(cornX, cornY);
            ORBIT_CTX.fillStyle = "rgba(255, 255, 255, 0.15)";
            ORBIT_CTX.fill();
            ORBIT_CTX.restore();

            // Moon
            const moonAngle = getMoonOrbitAngle(state.time);
            const mx = cx + Math.cos(moonAngle) * orbitRadius;
            const my = cy + Math.sin(moonAngle) * orbitRadius;

            ORBIT_CTX.save();
            ORBIT_CTX.translate(mx, my);
            ORBIT_CTX.beginPath();
            ORBIT_CTX.arc(0, 0, moonRadius, Math.PI/2, 3*Math.PI/2); 
            ORBIT_CTX.fillStyle = "#f1f5f9"; 
            ORBIT_CTX.fill();
            ORBIT_CTX.beginPath();
            ORBIT_CTX.arc(0, 0, moonRadius, -Math.PI/2, Math.PI/2); 
            ORBIT_CTX.fillStyle = "#334155";
            ORBIT_CTX.fill();
            ORBIT_CTX.restore();

            // Labels
            ORBIT_CTX.fillStyle = "#94a3b8";
            ORBIT_CTX.textAlign = "center";
            ORBIT_CTX.fillText("地球", cx, cy + earthRadius + 20);
            ORBIT_CTX.fillText("月", mx, my + moonRadius + 20);
        }

        // --- Sky View (Wide) ---
        function drawSkyView() {
            const w = SKY_CANVAS.width;
            const h = SKY_CANVAS.height;
            const cx = w / 2;
            const horizonY = h * 0.85;

            SKY_CTX.clearRect(0, 0, w, h);

            const pivotRadius = w * 0.7; 
            const apexY = h * 0.15; 
            const pivotY = apexY + pivotRadius; 

            const obsAngle = getEarthRotationAngle(state.time);
            let sunRelAngle = obsAngle - SUN_ANGLE;
            sunRelAngle = Math.atan2(Math.sin(sunRelAngle), Math.cos(sunRelAngle));
            
            const sunAltitude = Math.cos(sunRelAngle); 

            // Moon calculations
            const moonSpaceAngle = getMoonOrbitAngle(state.time);
            let moonRelAngle = obsAngle - moonSpaceAngle;
            moonRelAngle = Math.atan2(Math.sin(moonRelAngle), Math.cos(moonRelAngle));

            const celestialR = pivotRadius;
            const moonX = cx - celestialR * Math.sin(moonRelAngle);
            const moonY = pivotY - celestialR * Math.cos(moonRelAngle);
            const moonRadius = Math.min(w, h) * 0.08; 

            // Background
            drawSkyGradient(SKY_CTX, w, h, sunAltitude);

            // Stars
            let starVisibility = 1.0;
            if (sunAltitude > 0.4) starVisibility = 0;
            else if (sunAltitude > -0.1) {
                starVisibility = 1.0 - ((sunAltitude + 0.1) / 0.5);
            }

            if (starVisibility > 0) {
                SKY_CTX.fillStyle = `rgba(255, 255, 255, ${starVisibility})`;
                STARS.forEach(star => {
                    let starRelAngle = obsAngle - star.angle;
                    const R = pivotRadius * star.radiusOffset;
                    const sx = cx - R * Math.sin(starRelAngle);
                    const sy = pivotY - R * Math.cos(starRelAngle);

                    const dx = sx - moonX;
                    const dy = sy - moonY;
                    if (moonY < h) {
                        if (dx*dx + dy*dy < moonRadius * moonRadius) {
                            return; 
                        }
                    }
                    
                    if (sx > -10 && sx < w + 10 && sy > -10) {
                        SKY_CTX.beginPath();
                        SKY_CTX.arc(sx, sy, star.size, 0, Math.PI*2);
                        SKY_CTX.fill();
                    }
                });
            }

            // Sun
            const sunX = cx - celestialR * Math.sin(sunRelAngle);
            const sunY = pivotY - celestialR * Math.cos(sunRelAngle);
            const sunRadius = Math.min(w, h) * 0.08;

            const sunGlow = SKY_CTX.createRadialGradient(sunX, sunY, sunRadius*0.5, sunX, sunY, sunRadius*3);
            sunGlow.addColorStop(0, `rgba(252, 211, 77, ${Math.min(0.8, 0.4 + sunAltitude)})`);
            sunGlow.addColorStop(1, "rgba(252, 211, 77, 0)");
            SKY_CTX.fillStyle = sunGlow;
            SKY_CTX.beginPath();
            SKY_CTX.arc(sunX, sunY, sunRadius*3, 0, Math.PI * 2);
            SKY_CTX.fill();
            
            SKY_CTX.beginPath();
            SKY_CTX.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            SKY_CTX.fillStyle = "#fcd34d";
            SKY_CTX.fill();

            // Moon
            const phaseInfo = getPhaseInfo(moonSpaceAngle);
            drawUprightMoonPhase(SKY_CTX, moonX, moonY, moonRadius, phaseInfo.radians, sunAltitude);
            
            if (moonY < horizonY + moonRadius * 2) { 
                if(PHASE_NAME_DISPLAY.innerText !== phaseInfo.name) {
                    PHASE_NAME_DISPLAY.innerText = phaseInfo.name;
                }
            } else {
                PHASE_NAME_DISPLAY.innerText = phaseInfo.name + " (沈)";
            }

            // Ground
            const groundGrad = SKY_CTX.createLinearGradient(0, horizonY, 0, h);
            groundGrad.addColorStop(0, "#064e3b");
            groundGrad.addColorStop(1, "#022c22");
            SKY_CTX.fillStyle = groundGrad;
            SKY_CTX.fillRect(0, horizonY, w, h - horizonY);
            
            SKY_CTX.fillStyle = "#fff";
            SKY_CTX.font = "bold 16px sans-serif";
            SKY_CTX.textAlign = "center";
            SKY_CTX.fillText("東", w * 0.15, horizonY + 30);
            SKY_CTX.fillText("南", w * 0.5, horizonY + 30);
            SKY_CTX.fillText("西", w * 0.85, horizonY + 30);
        }

        // --- Current Moon Window ---
        function drawCurrentMoon() {
            const w = CURRENT_MOON_CANVAS.width;
            const h = CURRENT_MOON_CANVAS.height;
            const cx = w / 2;
            const cy = h / 2;
            // パネルサイズに対して大きすぎないように調整
            const r = Math.min(w, h) * 0.35; 

            CURRENT_MOON_CTX.clearRect(0, 0, w, h);
            
            // 背景（宇宙色）
            CURRENT_MOON_CTX.fillStyle = "#020617";
            CURRENT_MOON_CTX.fillRect(0, 0, w, h);

            const moonSpaceAngle = getMoonOrbitAngle(state.time);
            const phaseInfo = getPhaseInfo(moonSpaceAngle);

            // sunAltitude = -1.0 (夜) を渡して、常に影をはっきり描画
            drawUprightMoonPhase(CURRENT_MOON_CTX, cx, cy, r, phaseInfo.radians, -1.0);
        }

        function drawSkyGradient(ctx, w, h, sunAlt) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            if (sunAlt > 0.3) { 
                grad.addColorStop(0, "#38bdf8");
                grad.addColorStop(1, "#bae6fd");
            } else if (sunAlt > 0) { 
                grad.addColorStop(0, "#3b82f6");
                grad.addColorStop(1, "#fbbf24"); 
            } else if (sunAlt > -0.2) { 
                grad.addColorStop(0, "#1e3a8a"); 
                grad.addColorStop(0.7, "#7c2d12"); 
                grad.addColorStop(1, "#ea580c"); 
            } else { 
                grad.addColorStop(0, "#020617");
                grad.addColorStop(1, "#1e293b");
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        function drawUprightMoonPhase(ctx, x, y, r, phaseRad, sunAltitude) {
            ctx.save();
            ctx.translate(x, y);

            let shadowAlpha = 1.0;
            if (sunAltitude > 0.1) {
                shadowAlpha = 0;
            } else if (sunAltitude > -0.2) {
                shadowAlpha = 1.0 - ((sunAltitude + 0.2) / 0.3);
            }

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            
            if (shadowAlpha > 0.01) {
                ctx.fillStyle = `rgba(30, 41, 59, ${shadowAlpha})`;
                ctx.fill();
            }

            if (shadowAlpha < 0.1 && (phaseRad < 0.2 || phaseRad > 2*Math.PI - 0.2)) {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.setLineDash([2, 3]);
                ctx.stroke();
            }

            ctx.fillStyle = (sunAltitude > 0) ? "#ffffff" : "#f8fafc";
            
            const p = phaseRad % (2 * Math.PI);

            ctx.beginPath();
            if (p <= Math.PI) {
                ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2);
            }
            
            if (p < Math.PI) {
                ctx.beginPath();
                ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2);
                const w = -Math.cos(p) * r; 
                ctx.ellipse(0, 0, Math.abs(w), r, 0, Math.PI/2, 3*Math.PI/2, w < 0);
            } else {
                const w = Math.cos(p) * r;
                ctx.beginPath();
                ctx.moveTo(0, r);
                ctx.arc(0, 0, r, Math.PI/2, 3*Math.PI/2);
                ctx.ellipse(0, 0, Math.abs(w), r, 0, 3*Math.PI/2, Math.PI/2, w > 0);
            }
            
            ctx.fill();
            ctx.restore();
        }

        // --- Loop ---
        function draw() {
            drawOrbitView();
            drawSkyView();
            drawCurrentMoon(); // 追加
            const timeData = formatTime(state.time);
            DAY_DISPLAY.innerText = timeData.dayStr;
            TIME_DISPLAY.innerText = timeData.timeStr;
            if(state.isPlaying) {
                TIME_SLIDER.value = state.time;
            }
        }

        function update() {
            if (state.isPlaying) {
                state.time += state.speed;
                if (state.time >= state.maxTime) {
                    state.time = state.maxTime;
                    state.isPlaying = false;
                    PLAY_BTN.innerText = "再生";
                    draw();
                    return; 
                }
                draw();
                state.animationId = requestAnimationFrame(update);
            }
        }

        TIME_SLIDER.addEventListener('input', (e) => {
            state.time = parseFloat(e.target.value);
            draw();
        });

        PLAY_BTN.addEventListener('click', () => {
            if (!state.isPlaying && state.time >= state.maxTime) {
                state.time = 0;
            }
            state.isPlaying = !state.isPlaying;
            PLAY_BTN.innerText = state.isPlaying ? "停止" : "再生";
            if(state.isPlaying) update();
            else cancelAnimationFrame(state.animationId);
        });

        SPEED_RADIOS.forEach(radio => {
            radio.addEventListener('change', (e) => {
                state.speed = parseFloat(e.target.value);
            });
        });

        setTimeout(resizeCanvas, 100);

    </script>
</body>
</html>
